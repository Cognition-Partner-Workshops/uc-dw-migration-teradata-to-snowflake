[project]
name = "td-cloud-migrator"
version = "0.1.0"
description = "Teradata to BigQuery / Redshift / Synapse migration POC: dump analysis, conversion, simulated load"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "BLE"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
