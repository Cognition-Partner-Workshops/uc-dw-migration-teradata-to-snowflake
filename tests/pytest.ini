[pytest]
markers =
    schema: Schema validation tests
    row_count: Row count validation tests
    data_integrity: Data integrity & checksum tests
    referential_integrity: Referential integrity tests
    business_logic: Business logic validation tests
    translation: Teradata-to-Snowflake translation parity tests
    negative: Negative / constraint enforcement tests
    edge_case: Edge case & boundary tests
    view_parity: View parity tests
    stored_procedure: Stored procedure / macro parity tests
    sample_data: Sample data comparison tests
